<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    FrameForge HTML Compositor Page
    ================================
    This page is the render target for headless Playwright captures.
    render.mjs navigates here, injects the virtual-clock shim, then calls
    window.__seek(t) once per frame to advance to time t.

    DO NOT add async resource loads (remote fonts, CDN scripts) — all assets
    must be local so the page reaches `networkidle` deterministically.

    The #stage div is required. engine.js appends all layer divs into it.
    Its dimensions are set by reel() in edit.js and matched by
    page.setViewportSize() in render.mjs.
  -->
  <link rel="stylesheet" href="reel/engine.css">
  <style>
    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* #stage is sized by reel() in edit.js (via CSS custom props set inline).
       Fallback: 1920×1080. render.mjs also calls page.setViewportSize(). */
    #stage {
      position: relative;
      width:  var(--reel-width,  1920px);
      height: var(--reel-height, 1080px);
      overflow: hidden;
      background: #000;
    }

    /* Layer divs injected by engine.js */
    #stage > [data-layer] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Captions overlay — placed by engine.js captions() */
    #caption-overlay {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- The compositor stage. All layers are appended here by engine.js. -->
  <div id="stage"></div>

  <!--
    edit.js is the author-written animation file.
    It imports from ./reel/engine.js and calls:
      reel({ width, height, fps, duration, title })
      layer('name').on(t => ({ ...styles }))
      at(t, element)
    etc.

    The module type is required — engine.js uses ES module exports.
  -->
  <script type="module" src="edit.js"></script>
</body>
</html>
