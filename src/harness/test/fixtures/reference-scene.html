<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body { margin: 0; background: #0c1116; overflow: hidden; }</style>
</head>
<body>
<canvas id="frame" width="1080" height="1080"></canvas>
<script>
window.DURATION = 2;
const ctx = document.querySelector("#frame").getContext("2d");
window.seek = async (t) => {
  ctx.fillStyle = "#0c1116";
  ctx.fillRect(0, 0, 1080, 1080);
  ctx.fillStyle = "#5be2a1";
  ctx.beginPath();
  ctx.arc(120 + 400 * t, 540, 80, 0, 2 * Math.PI);
  ctx.fill();
};
</script>
</body>
</html>
