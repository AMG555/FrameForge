name = "frameforge-mcp"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Secrets (set via: wrangler secret put <NAME>)
# WORKER_API_URL        — full URL to your Worker API, e.g. https://yourapp.onrender.com
# MCP_AUTH_TOKEN        — random 32-byte hex for bearer auth (optional but recommended)
# INTERNAL_API_TOKEN    — shared secret between this Worker and the Render API
# GROQ_API_KEY          — for direct LLM calls if you add them to this Worker later

[vars]
# Non-secret environment variables
PIPELINE_VERSION = "1.0.0"
# Per-token rate limit: max tool calls per sliding 1-hour window.
# Set to 0 to disable rate limiting.
RATE_LIMIT_PER_HOUR = "100"

# ── KV namespace for rate limiting ──────────────────────────────────────────
# Create with: wrangler kv:namespace create "RATE_LIMITS"
# Then paste the returned id below.
# Workers KV is free for <1k writes/day on the free tier.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_PREVIEW_ID"

# ── Cron trigger: keep Render free from sleeping ────────────────────────────
# Pings the Worker API /health endpoint every 8 minutes so the Render free
# dyno stays warm during overnight pipeline runs.
# Workers Cron Triggers are free (unlimited invocations on all plans).
[triggers]
crons = ["*/8 * * * *"]
