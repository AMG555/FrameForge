name = "video-pipeline-mcp"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Secrets (set via: wrangler secret put <NAME>)
# WORKER_API_URL   — full URL to your Worker API, e.g. https://yourapp.onrender.com
# MCP_AUTH_TOKEN   — random 32-byte hex for bearer auth (optional but recommended)
# GROQ_API_KEY     — for direct LLM calls if you add them to this Worker later

[vars]
# Non-secret environment variables
PIPELINE_VERSION = "1.0.0"
