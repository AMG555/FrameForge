# render.yaml — OPTIONAL Render.com deployment config
#
# This file is only needed if you want to host the FrameForge worker on Render.com.
# For local/VPS/Pi deployments, ignore this file and use:
#   npm run mcp               (MCP server, port 3210)
#   npm run start:worker      (queue worker, port 3211)
#
# If deploying to Render: push this repo, Render detects this file, and deploys automatically.
# Set GROQ_API_KEY (and any other keys) as secrets in the Render dashboard.
# Point LOCAL_RENDER_URL at a machine running `npm run start:local-render` for FFmpeg rendering.
#
services:
  - type: web
    name: video-pipeline-worker
    runtime: node
    plan: free          # 512 MB RAM, sleeps after 15 min, no persistent disk
    buildCommand: npm install
    startCommand: RENDER_MODE=api_only node src/worker/server-render-free.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_PORT
        value: 3211
      - key: RENDER_MODE
        value: api_only
      - key: N8N_FILES_DIR
        value: /tmp/video-pipeline
      # Set these as secrets in the Render dashboard:
      - key: GROQ_API_KEY
        sync: false
      - key: PROVIDER_LLM
        value: groq
      - key: PROVIDER_TTS
        value: edge-tts
      # Delivery webhook (optional):
      - key: PUBLISH_WEBHOOK_URL
        sync: false
      - key: REVIEW_NOTIFY_URL
        sync: false
      # Point to your local machine / Pi for FFmpeg rendering:
      - key: LOCAL_RENDER_URL
        sync: false       # e.g. https://yourpi.tailnet.ts.net:3211
    healthCheckPath: /health
    autoDeploy: true     # redeploy on git push
